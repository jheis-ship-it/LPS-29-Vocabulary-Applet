  <!-- MENU -->

<script>
// ============================================================
// QUESTION BANK  (graded + selfCheck per week)
// ============================================================
const questionBank = {

  week1: {
    graded: [
      {
        type:"mc",
        question:"Which of the following best defines an ARGUMENT in critical reasoning?",
        options:[
          "A heated verbal exchange between two or more people who hold opposing views and each tries to persuade the other.",
          "A set of determinately true or false sentences with premises, a conclusion, and a claim about the connection between them.",
          "Any declarative statement that makes a factual claim about the external world.",
          "A logical puzzle or thought experiment that is designed to have no single definitive answer."
        ],
        answer:1,
        explanation:"An ARGUMENT is a set of determinately true or false sentences with three elements: one or more premises (evidence/support), one conclusion, and a claim about the connection between them."
      },
      {
        type:"mc",
        question:"A sentence is VAGUE if and only if it:",
        options:[
          "Can be interpreted in more than one grammatically correct way depending on word order.",
          "Makes a claim about the world that cannot in principle be empirically verified.",
          "Has absolute borderline cases — situations where it is genuinely unclear whether the sentence applies.",
          "Is not directly relevant to the conclusion of the argument it appears in."
        ],
        answer:2,
        explanation:"A sentence is VAGUE if it has absolute borderline cases — situations where it is genuinely unclear whether the sentence applies."
      },
      {
        type:"mc",
        question:"Which of the following is NOT one of the three elements of an argument?",
        options:[
          "One or more premises that provide evidence or support for the conclusion.",
          "One conclusion that follows from or is supported by the premises.",
          "A claim about the connection between the premises and the conclusion.",
          "A counterexample that could potentially disprove or undermine the conclusion."
        ],
        answer:3,
        explanation:"The three elements are: (1) premises, (2) one conclusion, and (3) a claim about their connection. A counterexample is not part of the definition of an argument."
      },
      {
        type:"mc",
        question:"Which of the following is the best example of a VAGUE sentence?",
        options:[
          "The number 7 is an odd number and therefore not divisible by 2.",
          "All bachelors are by definition unmarried adult males.",
          "John is tall.",
          "Water reaches its boiling point at exactly 100 degrees Celsius at standard sea-level pressure."
        ],
        answer:2,
        explanation:"\"John is tall\" is vague because there is no sharp cutoff for what counts as 'tall' — there are absolute borderline cases where it is genuinely unclear whether the word applies."
      },
      {
        type:"fitb",
        question:"An ARGUMENT has three elements: one or more ________, one conclusion, and a claim about the connection between the premises and the conclusion.",
        answers:["premises","premise"],
        explanation:"The three elements are: (1) one or more premises (evidence/support), (2) one conclusion, and (3) a claim about the connection between them."
      },
      {
        type:"fitb",
        question:"A sentence is ________ if it has absolute borderline cases.",
        answers:["vague"],
        explanation:"A sentence is VAGUE if it has absolute borderline cases — situations where it is genuinely unclear whether the sentence is true or false."
      },
      {
        type:"fitb",
        question:"An argument contains one or more premises, one ________, and a claim about the connection between them.",
        answers:["conclusion"],
        explanation:"The three elements of an argument are: premises, one conclusion, and a claim about their connection."
      }
    ],
    selfCheck: [
      {
        prompt:"Fill in the blank: An ARGUMENT is ________",
        fullDef:"An ARGUMENT is a set of determinately true or false sentences with three elements: (1) one or more premises, which provide evidence or support; (2) one conclusion, which follows from or is supported by the premises; and (3) a claim about the connection between the premises and the conclusion."
      },
      {
        prompt:"Fill in the blank: A sentence is VAGUE if and only if ________",
        fullDef:"A sentence is VAGUE if it has absolute borderline cases — that is, situations in which it is genuinely unclear whether the sentence is true or false."
      }
    ]
  },

  week2: {
    graded: [
      {
        type:"mc",
        question:"What is a DEDUCTIVE ARGUMENT?",
        options:[
          "An argument in which the premises are claimed to make the conclusion probable or likely, but not certain.",
          "An argument in which the premise(s) are claimed to lend absolute support to the conclusion.",
          "An argument that has been independently verified to be both valid and sound.",
          "An argument that contains at least two premises and whose conclusion has been confirmed as true."
        ],
        answer:1,
        explanation:"A DEDUCTIVE ARGUMENT is one in which the premise(s) are claimed to lend absolute support to the conclusion."
      },
      {
        type:"mc",
        question:"What is an INDUCTIVE ARGUMENT?",
        options:[
          "An argument whose conclusion is guaranteed to be true if the premises are true.",
          "An argument in which the premises are claimed to lend absolute and certain support to the conclusion.",
          "An argument in which the premises are claimed to make the conclusion probable or likely, but not absolutely certain.",
          "An argument that relies on formal rules of inference to derive its conclusion step by step."
        ],
        answer:2,
        explanation:"An INDUCTIVE ARGUMENT is one in which the premises do not claim absolute support; instead, they are claimed to make the conclusion probable or likely."
      },
      {
        type:"mc",
        question:"An argument is DEDUCTIVELY VALID if and only if:",
        options:[
          "All of its premises have been independently verified to be true.",
          "It has no counterexamples — no possible situation where all premises are true and the conclusion false.",
          "Its conclusion is a statement that is necessarily true in all possible worlds.",
          "It has high inductive probability based on available empirical evidence."
        ],
        answer:1,
        explanation:"An argument is DEDUCTIVELY VALID if it has no counterexamples — no possible situation where all premises are true and the conclusion is false."
      },
      {
        type:"mc",
        question:"What is a COUNTEREXAMPLE to an argument?",
        options:[
          "A premise within the argument that directly contradicts or conflicts with another premise.",
          "A logical rule or principle that is strong enough to defeat the argument entirely.",
          "A possible situation in which all of the premises are true and the conclusion is false.",
          "A supporting example that helps confirm or strengthen the argument's conclusion."
        ],
        answer:2,
        explanation:"A COUNTEREXAMPLE to an argument is a possible situation (or possible world) in which all of the premises are true and the conclusion is false."
      },
      {
        type:"mc",
        question:"An argument is SOUND if:",
        options:[
          "It has high inductive probability and each of its individual premises has been confirmed as true.",
          "Its premises are all true AND the argument is deductively valid.",
          "It has no counterexamples and its conclusion is considered probable rather than certain.",
          "Its conclusion is supported by strong inductive reasoning and empirical evidence."
        ],
        answer:1,
        explanation:"An argument is SOUND if its premises are all true AND it is deductively valid."
      },
      {
        type:"mc",
        question:"An argument has HIGH INDUCTIVE PROBABILITY if:",
        options:[
          "Every one of its premises has been independently confirmed as true.",
          "It has absolutely no counterexamples in any possible world or scenario.",
          "The truth of the conclusion is very likely given the truth of the premises.",
          "It is both deductively valid and all of its premises are known to be true."
        ],
        answer:2,
        explanation:"An argument has HIGH INDUCTIVE PROBABILITY if the truth of the conclusion is very likely given the truth of the premises."
      },
      {
        type:"mc",
        question:"A kind of reasoning is MONOTONIC if:",
        options:[
          "Adding new premises to an argument could potentially cause it to fail to provide its claimed support for the conclusion.",
          "Adding new premises will NOT make an argument that succeeds in providing the claimed support for its conclusion fail to do so.",
          "The argument relies on a single premise to establish the truth of its conclusion.",
          "The conclusion of the argument simply restates or summarizes one of the premises."
        ],
        answer:1,
        explanation:"A kind of reasoning is MONOTONIC if adding new premises will NOT make an argument that succeeds in providing the claimed support for its conclusion fail to do so."
      },
      {
        type:"mc",
        question:"A kind of reasoning is NON-MONOTONIC if:",
        options:[
          "Adding new premises to the argument can never change or affect the argument's support for its conclusion.",
          "The argument contains no premises at all and relies solely on the conclusion itself.",
          "Adding new premises COULD make an argument that succeeds in providing the claimed support for its conclusion fail to do so.",
          "The argument relies exclusively on inductive logic and probabilistic reasoning throughout."
        ],
        answer:2,
        explanation:"A kind of reasoning is NON-MONOTONIC if adding new premises COULD make an argument that succeeds in providing its claimed support fail to do so."
      },
      {
        type:"mc",
        question:"An argument is DEDUCTIVELY INVALID if:",
        options:[
          "It contains no premises and relies only on the assertion of the conclusion.",
          "There is at least one counterexample — a possible situation where all premises are true and the conclusion is false.",
          "Each of its premises has been shown to be false through empirical investigation.",
          "It uses inductive reasoning rather than deductive reasoning to reach its conclusion."
        ],
        answer:1,
        explanation:"An argument is DEDUCTIVELY INVALID if there is at least one counterexample — a possible situation where all premises are true and the conclusion is false."
      },
      {
        type:"fitb",
        question:"A DEDUCTIVE ARGUMENT is an argument in which the premise(s) are claimed to lend ________ support to the conclusion.",
        answers:["absolute"],
        explanation:"A DEDUCTIVE ARGUMENT claims to provide absolute (certain) support for its conclusion."
      },
      {
        type:"fitb",
        question:"An argument is ________ if its premises are true and it is deductively valid.",
        answers:["sound"],
        explanation:"An argument is SOUND if its premises are all true AND it is deductively valid."
      },
      {
        type:"fitb",
        question:"An argument is DEDUCTIVELY VALID if it has no ________.",
        answers:["counterexamples","counterexample"],
        explanation:"An argument is DEDUCTIVELY VALID if there is no possible situation in which all premises are true and the conclusion is false."
      },
      {
        type:"fitb",
        question:"A kind of reasoning is ________ if adding new premises could make an argument that succeeds in providing the claimed support for its conclusion fail to do so.",
        answers:["non-monotonic"],
        explanation:"NON-MONOTONIC reasoning can be undermined by the addition of new premises."
      },
      {
        type:"fitb",
        question:"An INDUCTIVE ARGUMENT claims its premises make the conclusion ________ or likely, rather than absolutely certain.",
        answers:["probable","likely"],
        explanation:"An INDUCTIVE ARGUMENT claims its premises make the conclusion probable or likely — not absolutely certain."
      }
    ],
    selfCheck: [
      {
        prompt:"Fill in the blank: A DEDUCTIVE ARGUMENT is ________",
        fullDef:"A DEDUCTIVE ARGUMENT is an argument in which the premise(s) are claimed to lend absolute support to the conclusion."
      },
      {
        prompt:"Fill in the blank: An INDUCTIVE ARGUMENT is ________",
        fullDef:"An INDUCTIVE ARGUMENT is an argument in which the premise(s) are not claimed to lend absolute support to the conclusion. Instead, the premises are claimed to make the conclusion probable or likely."
      },
      {
        prompt:"Fill in the blank: An argument is DEDUCTIVELY VALID if ________",
        fullDef:"An argument is DEDUCTIVELY VALID if it has no counterexamples — that is, no possible situation in which all of the premises are true and the conclusion is false."
      },
      {
        prompt:"Fill in the blank: An argument is SOUND if ________",
        fullDef:"An argument is SOUND if its premises are all true and it is deductively valid."
      },
      {
        prompt:"Fill in the blank: A kind of reasoning is MONOTONIC if ________",
        fullDef:"A kind of reasoning is MONOTONIC if adding new premises will never weaken its claim."
      },
      {
        prompt:"Fill in the blank: A kind of reasoning is NON-MONOTONIC if ________",
        fullDef:"A kind of reasoning is NON-MONOTONIC if adding new premises could weaken its claim."
      }
    ]
  },

  week3: {
    graded: [
      {
        type:"mc",
        question:"What is a FALLACY?",
        options:[
          "A true statement that has been expressed in an unclear or misleading way.",
          "A faulty argument or a faulty kind of argument.",
          "An argument whose conclusion has been proven to be factually false.",
          "A premise within an argument that directly contradicts another premise in the same argument."
        ],
        answer:1,
        explanation:"A FALLACY is a faulty argument or a faulty kind of argument."
      },
      {
        type:"mc",
        question:"A person commits a FALLACY OF RELEVANCE if:",
        options:[
          "She uses ambiguous or vague language in her premises in order to mislead her audience.",
          "She claims her premises provide absolute support for the conclusion when in fact they do not provide absolute support.",
          "She supports her conclusion with premises that are not relevant to the truth of the conclusion.",
          "She significantly overestimates the degree of inductive support her premises provide for her conclusion."
        ],
        answer:2,
        explanation:"A FALLACY OF RELEVANCE occurs when a person supports her conclusion with premises that are not relevant to the truth of the conclusion."
      },
      {
        type:"mc",
        question:"A SEMANTIC FALLACY occurs when:",
        options:[
          "Every premise in the argument has independently been shown to be factually false.",
          "An argument relies on words or phrases with ambiguous or vague meanings.",
          "The conclusion of the argument does not logically follow from the premises provided.",
          "The argument is structured in a way that has absolutely no possible counterexamples."
        ],
        answer:1,
        explanation:"A SEMANTIC FALLACY occurs when an argument relies on words or phrases with ambiguous or vague meanings."
      },
      {
        type:"mc",
        question:"A person commits a DEDUCTIVE FALLACY if:",
        options:[
          "She uses inductive-style reasoning in a context that strictly requires deductive certainty.",
          "She claims her premises would make the conclusion merely probable when in fact they provide absolute deductive support.",
          "She claims that her premises would provide absolute support for the truth of the conclusion when in fact they would not provide absolute support.",
          "She uses ambiguous or vague language in one or more of the premises of her argument."
        ],
        answer:2,
        explanation:"A DEDUCTIVE FALLACY occurs when someone claims her premises provide absolute support for the conclusion when in fact they do not."
      },
      {
        type:"mc",
        question:"A person commits an INDUCTIVE FALLACY if:",
        options:[
          "She claims her premises provide absolute deductive support when they only make the conclusion somewhat likely.",
          "She claims her premises provide a certain degree of inductive support when they actually provide only a significantly weaker degree of support.",
          "She uses premises that have no relevance whatsoever to the truth or falsity of her conclusion.",
          "She relies on ambiguous or vague language to make her argument seem stronger than it actually is."
        ],
        answer:1,
        explanation:"An INDUCTIVE FALLACY occurs when someone overstates the inductive support her premises provide — claiming a certain level of support when the premises only provide significantly weaker support."
      },
      {
        type:"fitb",
        question:"A FALLACY is a faulty ________ or a faulty kind of argument.",
        answers:["argument"],
        explanation:"A FALLACY is a faulty argument or a faulty kind of argument."
      },
      {
        type:"fitb",
        question:"A person commits a ________ FALLACY if her argument relies on words or phrases with ambiguous or vague meanings.",
        answers:["semantic"],
        explanation:"A SEMANTIC FALLACY exploits ambiguous or vague language."
      },
      {
        type:"fitb",
        question:"A FALLACY OF ________ occurs when premises that are not relevant to the truth of the conclusion are used to support it.",
        answers:["relevance"],
        explanation:"A FALLACY OF RELEVANCE uses premises that are irrelevant to the truth of the conclusion."

// ============================================================
// STATE
// ============================================================
let gradedQuestions  = [];
let selfCheckQuestions = [];
let currentIndex     = 0;
let score            = 0;
let answered         = false;
let phase            = "graded"; // "graded" | "selfcheck"
let missedQuestions  = [];
let isRedoMode       = false;
let currentQuizKey   = "";

// ============================================================
// UTILITIES
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }

// ============================================================
// START QUIZ
// ============================================================
function startQuiz() {
  const sel = document.getElementById("quiz-select").value;
  if (!sel) { alert("Please select a quiz first!"); return; }
  currentQuizKey = sel;
  launchQuiz(sel, false);
}

function launchQuiz(sel, redoMode) {
  const weeks = quizConfig[sel];
  let allGraded = [];
  let allSelfCheck = [];

  weeks.forEach(w => {
    const bank = questionBank[w];
    if (bank) {
      if (bank.graded)    allGraded    = allGraded.concat(bank.graded);
      if (bank.selfCheck) allSelfCheck = allSelfCheck.concat(bank.selfCheck);
    }
  });

  if (allGraded.length === 0 && allSelfCheck.length === 0) {
    alert("There are no vocabulary definitions assigned for this week. Please select another quiz.");
    return;
  }

  isRedoMode       = redoMode;
  gradedQuestions  = shuffle(allGraded);
  selfCheckQuestions = shuffle(allSelfCheck);
  currentIndex     = 0;
  score            = 0;
  answered         = false;
  missedQuestions  = [];
  phase            = "graded";

  hide("menu-section");
  hide("results-section");
  show("quiz-section");

  setPhaseUI("graded");

  if (gradedQuestions.length === 0) {
    // skip straight to self-check
    phase = "selfcheck";
    setPhaseUI("selfcheck");
  }

  renderQuestion();
}

// ============================================================
// REDO MISSED
// ============================================================
function redoMissed() {
  if (missedQuestions.length === 0) return;
  gradedQuestions  = shuffle(missedQuestions);
  selfCheckQuestions = [];
  currentIndex     = 0;
  score            = 0;
  answered         = false;
  missedQuestions  = [];
  phase            = "graded";
  isRedoMode       = true;

  hide("results-section");
  show("quiz-section");
  setPhaseUI("graded");
  renderQuestion();
}

// ============================================================
// PHASE UI
// ============================================================
function setPhaseUI(p) {
  const banner = document.getElementById("phase-banner");
  const bar    = document.getElementById("progress-bar");
  if (p === "graded") {
    banner.textContent = "📝 Graded Questions";
    banner.className   = "phase-banner phase-graded";
    bar.className      = "progress-bar graded";
  } else {
    banner.textContent = "✏️ Self-Check: Complete the Definition (Ungraded)";
    banner.className   = "phase-banner phase-selfcheck";
    bar.className      = "progress-bar selfcheck";
  }
}

// ============================================================
// RENDER QUESTION
// ============================================================
function renderQuestion() {
  answered = false;
  document.getElementById("next-btn").style.display = "none";

  const card = document.getElementById("question-card");
  card.className = "question-card";

  if (phase === "graded") {
    const total = gradedQuestions.length;
    const pct   = (currentIndex / total) * 100;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-text").textContent =
      "Question " + (currentIndex + 1) + " of " + total;

    const q = gradedQuestions[currentIndex];
    if (q.type === "mc") renderMC(q, card);
    else                  renderFITB(q, card);

  } else {
    const total = selfCheckQuestions.length;
    const pct   = (currentIndex / total) * 100;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-text").textContent =
      "Self-Check " + (currentIndex + 1) + " of " + total;

    const q = selfCheckQuestions[currentIndex];
    renderSelfCheck(q, card);
  }
}

// ============================================================
// RENDER MC
// ============================================================
function renderMC(q, card) {
  const opts    = q.options.map((text, i) => ({ text, isCorrect: i === q.answer }));
  const shuffled = shuffle(opts);
  const optHtml = shuffled.map(o =>
    `<li><button class="option-btn" onclick="pickOption(this,${o.isCorrect})" data-correct="${o.isCorrect}">${o.text}</button></li>`
  ).join("");

  card.innerHTML = `
    <span class="badge badge-mc">Multiple Choice</span>
    <div class="question-text">${q.question}</div>
    <ul class="options-list">${optHtml}</ul>
    <div class="feedback" id="feedback"></div>`;
}

// ============================================================
// RENDER FITB
// ============================================================
function renderFITB(q, card) {
  card.innerHTML = `
    <span class="badge badge-fitb">Fill in the Blank</span>
    <div class="question-text">${q.question}</div>
    <input type="text" class="fitb-input" id="fitb-input"
      placeholder="Type your answer here..."
      onkeydown="if(event.key==='Enter') checkFitb()" autocomplete="off" />
    <button class="btn btn-primary" id="submit-btn" onclick="checkFitb()">Submit</button>
    <div class="feedback" id="feedback"></div>`;
  setTimeout(() => { const el = document.getElementById("fitb-input"); if (el) el.focus(); }, 50);
}

// ============================================================
// RENDER SELF-CHECK
// ============================================================
function renderSelfCheck(q, card) {
  card.className = "question-card selfcheck-card";
  card.innerHTML = `
    <span class="badge badge-selfcheck">✏️ Self-Check (Ungraded)</span>
    <div class="question-text">${q.prompt}</div>
    <textarea class="selfcheck-textarea" id="sc-input" placeholder="Write your answer here..."></textarea>
    <button class="btn btn-warning" id="sc-submit-btn" onclick="checkSelfCheck()">Submit &amp; Check</button>
    <div class="feedback" id="feedback"></div>`;
  setTimeout(() => { const el = document.getElementById("sc-input"); if (el) el.focus(); }, 50);
}

// ============================================================
// MULTIPLE CHOICE HANDLER
// ============================================================
function pickOption(btn, isCorrect) {
  if (answered) return;
  answered = true;

  document.querySelectorAll(".option-btn").forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === "true") b.classList.add("reveal");
  });

  const q  = gradedQuestions[currentIndex];
  const fb = document.getElementById("feedback");

  if (isCorrect) {
    btn.classList.remove("reveal");
    btn.classList.add("correct");
    score++;
    fb.className   = "feedback correct show";
    fb.textContent = "✅ Correct! " + q.explanation;
  } else {
    btn.classList.add("incorrect");
    fb.className   = "feedback incorrect show";
    fb.textContent = "❌ Incorrect. " + q.explanation;
    missedQuestions.push(q);
  }

  document.getElementById("next-btn").style.display = "inline-block";
}

// ============================================================
// FILL-IN-THE-BLANK HANDLER
// ============================================================
function checkFitb() {
  if (answered) return;
  const input     = document.getElementById("fitb-input");
  const submitBtn = document.getElementById("submit-btn");
  const fb        = document.getElementById("feedback");
  const q         = gradedQuestions[currentIndex];
  const val       = input.value.trim().toLowerCase();

  if (!val) { input.focus(); return; }

  answered       = true;
  input.disabled = true;
  submitBtn.disabled = true;

  const correct = q.answers.some(a => a.toLowerCase() === val);

  if (correct) {
    input.classList.add("correct");
    score++;
    fb.className   = "feedback correct show";
    fb.textContent = "✅ Correct! " + q.explanation;
  } else {
    input.classList.add("incorrect");
    fb.className   = "feedback incorrect show";
    fb.textContent = `❌ Incorrect. The correct answer is: "${q.answers[0]}". ${q.explanation}`;
    missedQuestions.push(q);
  }

  document.getElementById("next-btn").style.display = "inline-block";
}

// ============================================================
// SELF-CHECK HANDLER
// ============================================================
function checkSelfCheck() {
  const input     = document.getElementById("sc-input");
  const submitBtn = document.getElementById("sc-submit-btn");
  const fb        = document.getElementById("feedback");
  const q         = selfCheckQuestions[currentIndex];

  submitBtn.disabled = true;
  input.disabled     = true;

  fb.className = "feedback selfcheck-fb show";
  fb.innerHTML = `<strong>Check for yourself:</strong> did you fill in the blank correctly?<br><br>
The correct answer is: <em>"${q.fullDef}"</em><br><br>
On your quiz, you won't need to produce this exact definition word-for-word, but you will need to give a definition that means the same thing as this one. Does your definition mean the same thing as this definition?`;

  document.getElementById("next-btn").style.display = "inline-block";
}

// ============================================================
// NEXT QUESTION
// ============================================================
function nextQuestion() {
  currentIndex++;

  if (phase === "graded") {
    if (currentIndex >= gradedQuestions.length) {
      // Done with graded; go to self-check (unless redo mode or no self-check)
      if (isRedoMode || selfCheckQuestions.length === 0) {
        showResults();
      } else {
        phase        = "selfcheck";
        currentIndex = 0;
        setPhaseUI("selfcheck");
        renderQuestion();
      }
    } else {
      renderQuestion();
    }
  } else {
    if (currentIndex >= selfCheckQuestions.length) {
      showResults();
    } else {
      renderQuestion();
    }
  }
}

// ============================================================
// RESULTS
// ============================================================
function showResults() {
  hide("quiz-section");
  show("results-section");

  const total = gradedQuestions.length;
  const pct   = total > 0 ? Math.round((score / total) * 100) : 0;

  document.getElementById("score-display").textContent = score + " / " + total;
  document.getElementById("score-pct").textContent     = pct + "% correct";

  let trophy, msg;
  if (total === 0) {
    trophy = "📖"; msg = "No graded questions in this selection. Great job completing the self-check!";
  } else if (pct === 100) {
    trophy = "🏆"; msg = "Perfect score! Outstanding work — you have completely mastered this material!";
  } else if (pct >= 80) {
    trophy = "🎉"; msg = "Great job! You have a strong grasp of these concepts. Review any missed questions and you'll be exam-ready!";
  } else if (pct >= 60) {
    trophy = "📚"; msg = "Good effort! You're on the right track — a bit more review of the definitions you missed will get you there!";
  } else {
    trophy = "💪"; msg = "Keep studying! Go back and carefully review the definitions, then try again. You've got this!";
  }

  document.getElementById("trophy").textContent    = trophy;
  document.getElementById("results-msg").textContent = msg;

  const missedDiv  = document.getElementById("missed-msg");
  const redoBtn    = document.getElementById("redo-missed-btn");

  if (missedQuestions.length > 0 && !isRedoMode) {
    missedDiv.textContent = `You missed ${missedQuestions.length} question${missedQuestions.length > 1 ? "s" : ""}. Would you like to redo just the questions you got wrong?`;
    show("missed-msg");
    show("redo-missed-btn");
  } else if (missedQuestions.length > 0 && isRedoMode) {
    missedDiv.textContent = `You still missed ${missedQuestions.length} question${missedQuestions.length > 1 ? "s" : ""}. Keep reviewing and try again!`;
    show("missed-msg");
    show("redo-missed-btn");
  } else {
    hide("missed-msg");
    hide("redo-missed-btn");
  }
}

// ============================================================
// RETRY / MENU
// ============================================================
function retryQuiz() {
  hide("results-section");
  const sel = currentQuizKey || document.getElementById("quiz-select").value;
  if (sel) launchQuiz(sel, false);
  else     goToMenu();
}

function goToMenu() {
  hide("results-section");
  hide("quiz-section");
  show("menu-section");
}
</script>
</body>
</html>
